id = "shadowfax.comments"
name = "Herdr Comments"
version = "0.1.0"
description = "Select and comment on frozen pane history, then review in Neovim."
min_herdr_version = "0.7.5"
platforms = ["macos"]

[[build]]
command = ["cargo", "build", "--release"]

[[actions]]
id = "capture"
title = "Annotate pane history"
description = "Open a frozen, scrollable annotation view for the focused pane."
contexts = ["pane"]
command = ["./target/release/herdr-comments", "capture"]

[[actions]]
id = "review"
title = "Review collected comments"
description = "Edit this pane's collected comments in Neovim before inserting them."
contexts = ["pane"]
command = ["./target/release/herdr-comments", "review"]

[[panes]]
id = "capture"
title = "Annotate pane history"
placement = "overlay"
command = ["./target/release/herdr-comments", "capture-popup"]

[[panes]]
id = "review"
title = "Review comments"
placement = "popup"
width = "90%"
height = "85%"
command = ["./target/release/herdr-comments", "review-popup"]
