[package]
name = "herdr-comments"
version = "0.1.0"
edition = "2021"
description = "Select and comment on frozen Herdr pane history"
license = "MIT"

[dependencies]
ansi-to-tui = "8.0.1"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
noyalib = "0.0.18"
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
unicode-width = "0.2"
uuid = { version = "1.18", features = ["v4"] }

[dev-dependencies]
tempfile = "3.20"

[lib]
name = "herdr_comments"
path = "src/lib.rs"

[[bin]]
name = "herdr-comments"
path = "src/main.rs"
